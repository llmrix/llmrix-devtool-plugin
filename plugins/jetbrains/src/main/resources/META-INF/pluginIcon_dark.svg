<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Background circle (lighter for dark theme) -->
  <circle cx="20" cy="20" r="20" fill="#1E3A4C"/>

  <!-- Brain + chat bubble icon (brighter cyan for dark theme visibility) -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DFFD8"/>
      <stop offset="100%" stop-color="#20D4F8"/>
    </linearGradient>
  </defs>

  <!-- Brain outline -->
  <g fill="none" stroke="url(#grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M17 13 C13 13 10 15.5 10 19 C10 21 11 22.5 12.5 23.5 C12 24 11.5 25 12 26 C13 27.5 14.5 27 15.5 26.5"/>
    <!-- Right hemisphere -->
    <path d="M23 13 C27 13 30 15.5 30 19 C30 21 29 22.5 27.5 23.5 C28 24 28.5 25 28 26 C27 27.5 25.5 27 24.5 26.5"/>
    <!-- Center divider -->
    <line x1="20" y1="13" x2="20" y2="27"/>
    <!-- Brain ridges left -->
    <path d="M14 17 C15 15.5 17 15.5 18 17"/>
    <path d="M12.5 21 C13.5 19.5 15.5 19.5 16.5 21"/>
    <!-- Brain ridges right -->
    <path d="M22 17 C23 15.5 25 15.5 26 17"/>
    <path d="M23.5 21 C24.5 19.5 26.5 19.5 27.5 21"/>
    <!-- Chat bubble tail -->
    <path d="M18 27 L16 31 L21 28"/>
    <!-- Top code bracket decoration -->
    <path d="M17 11 L15 12.5 L17 13.8"/>
    <path d="M23 11 L25 12.5 L23 13.8"/>
  </g>

  <!-- Center dot -->
  <circle cx="20" cy="19" r="1.5" fill="url(#grad)"/>
</svg>
